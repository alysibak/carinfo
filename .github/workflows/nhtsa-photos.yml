name: NHTSA photos

# Lists NHTSA's photo of each car it has rated (scripts/build-nhtsa-photos.ts)
# in server/data/nhtsa-photos.json, from api.nhtsa.gov, which GitHub's
# runners reach. Years already listed are kept but for the latest two, which
# NHTSA adds to through the year. When the list changes, the result goes to
# the nhtsa-photos branch and a pull request for review, never straight to
# main; otherwise no branch is made.
on:
  # A change to the lister lists again: the missing years and the latest two.
  push:
    branches: [main]
    paths:
      - .github/workflows/nhtsa-photos.yml
      - server/scripts/build-nhtsa-photos.ts
      - server/scripts/lib/nhtsa-photos.ts
  schedule:
    - cron: '41 10 * * 1' # Mondays, after the EPA refresh
  workflow_dispatch:
    inputs:
      from:
        description: First model year to list
        default: '1995'
      refresh:
        description: List every year again, not only the missing and latest two
        type: boolean
        default: false

concurrency:
  group: nhtsa-photos
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '24'

jobs:
  photos:
    name: List NHTSA photos
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # About a thousand requests a year, three a second: NHTSA refuses a
      # runner that asks faster. The script saves each year as it goes, so a
      # run cut short still pushes the years it finished, and the next run
      # carries on.
      - name: List photos
        timeout-minutes: 270
        env:
          FROM: ${{ inputs.from }}
          REFRESH: ${{ inputs.refresh && '--refresh' || '' }}
        run: |
          # The weekly run: the latest two years, which NHTSA adds to. A push
          # or a manual run lists every year still missing, newest first.
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then FROM=$(( $(date +%Y) - 1 )); fi
          npm run build-nhtsa-photos --workspace=server -- --from="${FROM:-1995}" $REFRESH | tee nhtsa-photos-report.txt

      - name: Push to the nhtsa-photos branch
        id: push
        if: always()
        run: |
          { echo '```'; cat nhtsa-photos-report.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git add -N server/data/nhtsa-photos.json
          if git diff --quiet -- server/data/nhtsa-photos.json; then
            echo 'Nothing new from NHTSA: no branch to push.'
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B nhtsa-photos
          git add server/data/nhtsa-photos.json
          git commit -m "List NHTSA photos ($(date -u +%F))" -m "$(tail -n 1 nhtsa-photos-report.txt || true)"
          git push -f origin nhtsa-photos

      - name: Open a pull request
        # A scheduled run's event carries no repository, so name the branch.
        if: always() && steps.push.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view nhtsa-photos --json state -q .state 2>/dev/null | grep -q OPEN; then
            echo 'The nhtsa-photos pull request is already open, now with this run.'
          else
            gh pr create --base "$GITHUB_REF_NAME" --head nhtsa-photos \
              --title 'List NHTSA photos' \
              --body 'New or changed photos from NHTSA. The site picks a car'"'"'s photo from this list when it builds (server/src/utils/nhtsa-photos.ts): only one of the same model year, model and body.' \
              || echo '::warning::Could not open a pull request (Settings > Actions > General lets workflows create them); the nhtsa-photos branch has the list.'
          fi

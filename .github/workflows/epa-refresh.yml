name: EPA refresh

# Adds the cars EPA has listed since cars.json was last refreshed, and
# refreshes the Canadian cars EPA never rated from Natural Resources Canada.
# NHTSA's ratings come from the Public data workflow (nhtsa-ratings.json),
# matched to every car when the database is built. The data scripts download
# from fueleconomy.gov and open.canada.ca, which GitHub's runners reach. When the
# data changes, the result goes to the epa-refresh branch (with the report and
# EPA's file, for a look) and the site's files go on main once they pass the
# data checks and the tests (.github/actions/land-on-main); otherwise no
# branch is made.
#
# Horsepower is left as committed: new cars take the site's maker ratings and
# same-engine fills. A rebuild of horsepower-enrichment.json with today's
# matcher fixes some ratings and breaks others (October 2026: a 2007 Cayenne
# 3.6 at 415 hp, a 2009 Sport Trac V8 at 248), so it needs its own review.
on:
  schedule:
    - cron: '23 9 * * 1' # Mondays: EPA adds certifications all year
  workflow_dispatch:

concurrency:
  group: epa-refresh
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash # -eo pipefail, so a failing script fails its step through `tee`

env:
  NODE_VERSION: '24'

jobs:
  refresh:
    name: Refresh from EPA and NRCan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Downloads EPA's current vehicles.csv and reports, by model, what it
      # adds, what it leaves out and why, and any car whose EPA row is gone.
      - name: Add EPA's new listings
        run: npm run backfill-epa-variants --workspace=server | tee epa-refresh-report.txt

      # After EPA's: a Canadian row EPA has since listed is skipped, not doubled.
      - name: Canadian cars from NRCan
        run: npm run import-nrcan --workspace=server | tee -a epa-refresh-report.txt

      - name: Check fuel types against EPA
        run: npm run reconcile-fuel-types --workspace=server | tee -a epa-refresh-report.txt

      - name: Build enrichment
        run: npm run build-enrichment --workspace=server | tee -a epa-refresh-report.txt

      # The model-year constants (first, newest, newest full lineup) follow the
      # data, so a new model year moves nothing by hand.
      - name: Model-year constants
        run: npx tsx server/scripts/update-model-years.ts | tee -a epa-refresh-report.txt

      # The outcome goes in the branch's commit message; main takes the files
      # only when they pass (below).
      - name: Tests
        id: tests
        continue-on-error: true
        run: |
          npm run build-runtime-db --workspace=server
          npm test

      - name: Push to the epa-refresh branch
        id: push
        run: |
          { echo '```'; cat epa-refresh-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- server/data/; then
            echo 'Nothing new from EPA or NRCan: no branch to push.'
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          gzip -9 -k server/data/raw/vehicles.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B epa-refresh
          git add epa-refresh-report.txt server/data/cars.json server/data/epa-enrichment.json \
            server/src/config/model-years.ts
          # EPA's file as read, so the refresh can be checked against it.
          git add -f server/data/raw/vehicles.csv.gz
          git commit -m "Refresh from EPA and NRCan ($(date -u +%F))" \
            -m "Tests: ${{ steps.tests.outcome }}. Report: epa-refresh-report.txt."
          git push -f origin epa-refresh

      # The site reads main, so the files go there, checked (.github/actions/land-on-main).
      - name: Put the site's files on main
        if: steps.push.outputs.changed == 'true'
        uses: ./.github/actions/land-on-main
        with:
          files: server/data/cars.json server/data/epa-enrichment.json server/src/config/model-years.ts
          message: Refresh from EPA and NRCan
          report: epa-refresh-report.txt

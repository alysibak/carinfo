name: Car photos

# Collects a photo of each car's own model year from Wikimedia Commons, with
# its generation from Wikipedia (scripts/build-car-photos.ts), in
# server/data/car-photos.json; GitHub's runners reach both. When the list changes, the
# result goes to the car-photos branch, for a look, and on main once it passes
# the data checks (.github/actions/land-on-main); otherwise no branch is made.
on:
  # A change to the collector collects again.
  push:
    branches: [main]
    paths:
      - .github/workflows/car-photos.yml
      - server/scripts/build-car-photos.ts
      - server/scripts/lib/wiki-photos.ts
      - server/scripts/lib/year-photos.ts
      - server/src/utils/car-photos.ts
  schedule:
    - cron: '37 10 1 * *' # Monthly: Wikipedia's photos change slowly
  workflow_dispatch:

concurrency:
  group: car-photos
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '24'

jobs:
  photos:
    name: Collect car photos
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # A few thousand requests to Wikipedia's API and as many to Commons', one at a time.
      - name: Collect photos
        run: npm run build-car-photos --workspace=server | tee car-photos-report.txt

      - name: Push to the car-photos branch
        id: push
        run: |
          { echo '```'; cat car-photos-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git add -N server/data/car-photos.json
          if git diff --quiet -- server/data/car-photos.json; then
            echo 'No change from Wikipedia: no branch to push.'
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B car-photos
          git add server/data/car-photos.json
          git commit -m "Collect car photos ($(date -u +%F))" -m "$(grep 'Done:' car-photos-report.txt || true)"
          git push -f origin car-photos

      # The site reads main, so the list goes there, checked: a run that lost
      # photos (Commons' search came back empty for 36 makes' years once) stays
      # on the branch (.github/actions/land-on-main, server/scripts/check-site-data.ts).
      - name: Put the site's files on main
        if: steps.push.outputs.changed == 'true'
        uses: ./.github/actions/land-on-main
        with:
          files: server/data/car-photos.json
          message: Collect car photos
          report: car-photos-report.txt

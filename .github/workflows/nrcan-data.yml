name: NRCan data

# Fetches Natural Resources Canada's fuel consumption ratings (open.canada.ca)
# to the nrcan-raw branch, so the Canada-only importer can be written against
# the real files. Temporary: the EPA refresh takes this over once the importer
# exists.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/nrcan-data.yml']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download every CSV in the dataset
        run: |
          mkdir -p nrcan
          curl -fsSL --retry 3 -o nrcan/package.json \
            'https://open.canada.ca/data/api/action/package_show?id=98f1a129-f628-4ce4-b24d-6f16bf24dd64'
          jq -r '.result.title' nrcan/package.json
          jq -r '.result.resources[] | [.format, (.language | join(",")), .name, .url] | @tsv' nrcan/package.json
          jq -r '.result.resources[] | select((.format | ascii_upcase) == "CSV") | .url' nrcan/package.json |
            while read -r url; do
              name=$(basename "${url%%\?*}" | sed 's/%20/ /g')
              curl -fsSL --retry 3 -o "nrcan/$name" "$url" || echo "::warning::Could not download $url"
            done
          ls -la nrcan
      - name: Push to the nrcan-raw branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan nrcan-raw
          git rm -rq --cached .
          git add nrcan
          git commit -qm "NRCan fuel consumption ratings ($(date -u +%F))"
          git push -f origin nrcan-raw

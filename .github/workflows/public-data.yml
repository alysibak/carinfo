name: Public data

# Downloads the government data the site's safety, recall, complaint, size and
# fuel-price facts come from (server/scripts/fetch-public-data.ts): NHTSA's
# star ratings and safety features, its recall, complaint and investigation
# files, Transport Canada's recalls and vehicle dimensions, Statistics Canada's
# pump prices and NRCan's fuel consumption ratings. GitHub's runners reach
# them all.
#
# The result goes to the public-data-files branch for review, never straight
# to main: the site reads only what has been matched to its cars and checked.
# Each part runs on its own, so one source being down leaves the others.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-data.yml
      - server/scripts/fetch-public-data.ts
  schedule:
    - cron: '41 8 * * 2' # Tuesdays: recalls and complaints arrive daily
  workflow_dispatch:
    inputs:
      parts:
        description: 'Parts to fetch, space-separated (all, recalls, complaints, investigations, canada-recalls, fuel-prices, nrcan, canadian-specs, nhtsa-ratings); the rest keep their last files'
        default: all

concurrency:
  group: public-data
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: server

env:
  NODE_VERSION: '24'
  FETCH: npx tsx scripts/fetch-public-data.ts
  # The schedule fetches everything. A push, to try a change to the fetching,
  # skips NHTSA's star ratings, which take three hours; they keep the last
  # run's file.
  PARTS: ${{ inputs.parts || (github.event_name == 'push' && 'recalls complaints investigations canada-recalls fuel-prices nrcan canadian-specs') || 'all' }}

jobs:
  fetch:
    name: Fetch public data
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        working-directory: .

      # A run of some parts keeps the other parts' files from the last run:
      # public-data-files, or before it the public-data branch.
      - name: Keep the last run's data
        run: |
          for branch in public-data-files public-data; do
            if git fetch --depth=1 origin "$branch"; then
              git checkout FETCH_HEAD -- data/public && break
            fi
          done || true

      - name: NHTSA recalls
        if: env.PARTS == 'all' || contains(format(' {0} ', env.PARTS), ' recalls ')
        continue-on-error: true
        run: |
          mkdir -p /tmp/rcl && cd /tmp/rcl
          # NHTSA splits its recalls at the 2010 report date.
          for part in PRE_2010 POST_2010; do
            curl -fsSL --retry 3 -o "FLAT_RCL_$part.zip" "https://static.nhtsa.gov/odi/ffdd/rcl/FLAT_RCL_$part.zip"
            unzip -l "FLAT_RCL_$part.zip" | tee -a "$GITHUB_WORKSPACE/public-data-report.txt"
            unzip -o -q -d flat "FLAT_RCL_$part.zip"
          done
          curl -fsSL --retry 3 -o RCL.txt https://static.nhtsa.gov/odi/ffdd/rcl/RCL.txt
          cat flat/*.txt > all.txt
          cd "$GITHUB_WORKSPACE/server"
          mkdir -p data/public/probe && cp /tmp/rcl/RCL.txt data/public/probe/RCL.txt
          $FETCH recalls /tmp/rcl/all.txt /tmp/rcl/RCL.txt 2>&1 | tee -a ../public-data-report.txt

      - name: NHTSA complaints
        if: env.PARTS == 'all' || contains(format(' {0} ', env.PARTS), ' complaints ')
        continue-on-error: true
        run: |
          mkdir -p /tmp/cmpl && cd /tmp/cmpl
          curl -fsSL --retry 3 -o FLAT_CMPL.zip https://static.nhtsa.gov/odi/ffdd/cmpl/FLAT_CMPL.zip
          curl -fsSL --retry 3 -o CMPL.txt https://static.nhtsa.gov/odi/ffdd/cmpl/CMPL.txt
          unzip -l FLAT_CMPL.zip | tee -a "$GITHUB_WORKSPACE/public-data-report.txt"
          unzip -o -q -d flat FLAT_CMPL.zip && rm FLAT_CMPL.zip && cat flat/*.txt > all.txt && rm -r flat
          cd "$GITHUB_WORKSPACE/server"
          mkdir -p data/public/probe && cp /tmp/cmpl/CMPL.txt data/public/probe/CMPL.txt
          $FETCH complaints /tmp/cmpl/all.txt /tmp/cmpl/CMPL.txt 2>&1 | tee -a ../public-data-report.txt

      - name: NHTSA investigations
        if: env.PARTS == 'all' || contains(format(' {0} ', env.PARTS), ' investigations ')
        continue-on-error: true
        run: |
          mkdir -p /tmp/inv && cd /tmp/inv
          curl -fsSL --retry 3 -o FLAT_INV.zip https://static.nhtsa.gov/odi/ffdd/inv/FLAT_INV.zip
          curl -fsSL --retry 3 -o INV.txt https://static.nhtsa.gov/odi/ffdd/inv/INV.txt
          unzip -l FLAT_INV.zip | tee -a "$GITHUB_WORKSPACE/public-data-report.txt"
          unzip -o -q -d flat FLAT_INV.zip && cat flat/*.txt > all.txt
          cd "$GITHUB_WORKSPACE/server"
          mkdir -p data/public/probe && cp /tmp/inv/INV.txt data/public/probe/INV.txt
          $FETCH investigations /tmp/inv/all.txt /tmp/inv/INV.txt 2>&1 | tee -a ../public-data-report.txt

      - name: Transport Canada recalls
        if: env.PARTS == 'all' || contains(format(' {0} ', env.PARTS), ' canada-recalls ')
        continue-on-error: true
        run: $FETCH canada-recalls 2>&1 | tee -a ../public-data-report.txt

      - name: Statistics Canada pump prices
        if: env.PARTS == 'all' || contains(format(' {0} ', env.PARTS), ' fuel-prices ')
        continue-on-error: true
        run: $FETCH fuel-prices 2>&1 | tee -a ../public-data-report.txt

      - name: NRCan fuel consumption ratings
        if: env.PARTS == 'all' || contains(format(' {0} ', env.PARTS), ' nrcan ')
        continue-on-error: true
        run: $FETCH nrcan 2>&1 | tee -a ../public-data-report.txt

      # The slow parts last, one request at a time, each with its own limit:
      # a timeout ends that part, and the parts before it are still pushed.
      - name: Transport Canada vehicle dimensions
        if: env.PARTS == 'all' || contains(format(' {0} ', env.PARTS), ' canadian-specs ')
        continue-on-error: true
        timeout-minutes: 60
        run: $FETCH canadian-specs 2>&1 | tee -a ../public-data-report.txt

      - name: NHTSA star ratings and safety features
        if: env.PARTS == 'all' || contains(format(' {0} ', env.PARTS), ' nhtsa-ratings ')
        continue-on-error: true
        timeout-minutes: 220
        run: $FETCH nhtsa-ratings 2>&1 | tee -a ../public-data-report.txt

      # The site's own files from them: recalls, complaints and investigations
      # by model line and year (scripts/build-safety-records.ts), NHTSA's ratings
      # (scripts/build-nhtsa-ratings.ts) and the pump prices
      # (scripts/build-pump-prices.ts), for review against main's.
      - name: Build the site's recall, complaint, rating and price records
        continue-on-error: true
        run: |
          npm run build-runtime-db
          npx tsx scripts/build-safety-records.ts data/public 2>&1 | tee -a ../public-data-report.txt
          npx tsx scripts/build-nhtsa-ratings.ts data/public 2>&1 | tee -a ../public-data-report.txt
          npx tsx scripts/build-pump-prices.ts data/public 2>&1 | tee -a ../public-data-report.txt
          npx prettier --write src/config/pump-prices.ts
          npx tsx scripts/build-canadian-specs.ts data/public 2>&1 | tee -a ../public-data-report.txt

      # The data alone, in a commit of its own: a branch carrying main's
      # history would change the workflow files it holds, which the job's
      # token may not (run 4 was refused for it).
      - name: Push to the public-data-files branch
        working-directory: .
        run: |
          { echo '```'; cat public-data-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan public-data-files
          # An empty index, whatever "Keep the last run's data" staged: run 10
          # stopped here when git rm --cached refused those files.
          git read-tree --empty
          # A build that failed leaves its file out, not the push.
          for path in public-data-report.txt server/data/public server/data/recalls-canada.json \
            server/data/complaints.json server/data/investigations.json server/data/nhtsa-ratings.json \
            server/data/canadian-specs.json server/src/config/pump-prices.ts; do
            if [ -e "$path" ]; then git add -f "$path"; fi
          done
          git commit -m "Public data ($(date -u +%F))" -m "$(grep '^Done' public-data-report.txt || true)"
          git push -f origin public-data-files
